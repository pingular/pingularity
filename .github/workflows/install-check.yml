      - name: 'PowerShell 7 (pwsh): Expand-Archive, Unblock-File, Start-Process, and whether this session is already an administrator'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'   # the runner sets Stop; a user's console has Continue, like the one-shot sees
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "== PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)) at $PSHOME"
          Write-Host "== The commands the raw-zip instructions and the one-shot rely on"
          foreach ($n in 'Expand-Archive', 'Unblock-File', 'Start-Process') {
            $c = Get-Command $n -ErrorAction SilentlyContinue
            if ($c) { Write-Host "   $n -> $($c.CommandType) from $($c.Source) $($c.Version)" } else { Write-Host "   $n -> NOT FOUND" }
          }
          Write-Host "== Is this session already an administrator? (the one-shot's IsInRole check)"
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]$identity
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "   user: $($identity.Name)"
          Write-Host "   IsInRole(Administrator): $isAdmin"
          Write-Host "   token level: $((whoami /groups | Select-String 'Mandatory Level' | ForEach-Object { ($_ -split '\s{2,}')[0] }) -join ', ')"
          if ($isAdmin) { Write-Host "   => already admin, so the one-shot's self-elevation branch (Start-Process -Verb RunAs `"`$PSHOME\powershell.exe`") did NOT run on this machine" }
          else { Write-Host "   => not admin, so the one-shot WOULD try to relaunch itself through `"`$PSHOME\powershell.exe`"" }
          Write-Host "== What happens when Start-Process is pointed at that relaunch path (no elevation; the child just exits with code 7)"
          $path = "$PSHOME\powershell.exe"
          Write-Host "   path  : $path"
          Write-Host "   exists: $(Test-Path $path)"
          try {
            $p = Start-Process -FilePath $path -ArgumentList '-NoProfile', '-Command', 'exit 7' -Wait -PassThru -NoNewWindow -ErrorAction Stop
            Write-Host "   Start-Process ran it; child exit code $($p.ExitCode)"
          } catch { Write-Host "   Start-Process ERROR: $($_.Exception.Message)" }
