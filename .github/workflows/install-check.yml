      - name: 'PowerShell 7 (pwsh): fetch winget.ps1 with a ''checker'' user agent, print its size and SHA256, parse it, never run it'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'   # the runner sets Stop; a user's console has Continue, like the one-shot sees
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "== PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)) at $PSHOME"
          $ua = 'pingularity-install-checker'
          Write-Host "== Invoke-RestMethod https://install.pingularity.dev/winget.ps1 -UserAgent '$ua'"
          Write-Host "   (that user agent is filtered out of the install count; the script is never executed here)"
          try {
            $script = Invoke-RestMethod -Uri 'https://install.pingularity.dev/winget.ps1' -UserAgent $ua
            Write-Host "   returned type : $($script.GetType().FullName)"
            Write-Host "   length (chars): $($script.Length)"
            $bytes = [Text.Encoding]::UTF8.GetBytes($script)
            $sha = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-', '').ToLower()
            Write-Host "   length (UTF-8 bytes): $($bytes.Length)"
            Write-Host "   SHA256 (UTF-8 bytes): $sha"
            Write-Host "   for comparison, curl from the maintainer's Mac on 2026-10-05 16:23 UTC saw 3993 bytes, SHA256 31a4d46f22b062ad2179e2250579c35d4a60ce57d3081bcd690e872534f284e8"
            $dir = Join-Path $env:RUNNER_TEMP 'fetched'
            $null = New-Item -ItemType Directory -Force -Path $dir
            $out = Join-Path $dir ("winget.ps1-" + $PSVersionTable.PSEdition + "-" + $PSVersionTable.PSVersion + ".txt")
            [IO.File]::WriteAllBytes($out, $bytes)
            Write-Host "   saved to: $out"
            $lines = $script -split "`n"
            Write-Host "   line 2: $($lines[1])"
            Write-Host "   line 3: $($lines[2])"
            Write-Host "   the relaunch line: $(($lines | Where-Object { $_ -match 'Start-Process' }) -join ' / ')"
            Write-Host "   the version check: $(($lines | Where-Object { $_ -match 'winget --version' }) -join ' / ')"
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors)
            Write-Host "== PARSE ONLY of the fetched script in this shell: errors = $($errors.Count)"
            foreach ($e in $errors) { Write-Host "   line $($e.Extent.StartLineNumber) col $($e.Extent.StartColumnNumber) [$($e.ErrorId)]: $($e.Message)" }
          } catch { Write-Host "   ERROR: $($_.Exception.Message)" }
