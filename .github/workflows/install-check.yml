          if ($wg) { Write-Host "   Get-Command winget -> $($wg.Source)" } else { Write-Host "   Get-Command winget -> NOT FOUND on PATH" }
          Write-Host "   > winget --version"
          $repair = $false
          try {
            $vout = ((winget --version) 2>&1 | Out-String)
            Write-Host "   output: $($vout.Trim())"
            $m = [regex]::Match($vout, 'v?(\d+)\.(\d+)')
            if (-not $m.Success) { $repair = $true }
            elseif ([int]$m.Groups[1].Value -eq 1 -and [int]$m.Groups[2].Value -lt 11) { $repair = $true }
          } catch { Write-Host "   threw: $($_.Exception.Message)"; $repair = $true }
