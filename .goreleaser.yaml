version: 2

project_name: pingularity

builds:
  - id: pingularity
    main: .
    binary: pingularity
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    # tar.gz everywhere, zip on Windows. Explicit (tolerant) globs so the
    # third-party dependency licences ship in every archive next to README/LICENSE.
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*
      - THIRD-PARTY-NOTICES.md
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - id: packages
    package_name: pingularity
    formats:
      - deb
      - rpm
    maintainer: cansofgrease <github@cansofgrease.com>
    homepage: https://github.com/pingular/pingularity
    description: Single-binary internet-connectivity monitor.
    # SPDX identifier; goreleaser stamps it into the deb control file and the rpm
    # License: tag. Paired with the LICENSE install below it satisfies each format's
    # policy tooling (lintian/rpmlint), which expects a package to carry both a
    # declared licence and its copyright text.
    license: MIT
    section: net
    bindir: /usr/bin
    contents:
      - src: packaging/pingularity.service
        dst: /usr/lib/systemd/system/pingularity.service
      - src: packaging/pingularity.env
        dst: /etc/default/pingularity
        type: config|noreplace
      # Ship the licence at the conventional package doc path.
      - src: LICENSE
        dst: /usr/share/doc/pingularity/copyright
        file_info:
          mode: 0644
      # ...and the bundled third-party dependency licences alongside it.
      - src: THIRD-PARTY-NOTICES.md
        dst: /usr/share/doc/pingularity/THIRD-PARTY-NOTICES.md
        file_info:
          mode: 0644
    # ExecReload=/bin/kill -HUP in the unit needs /bin/kill, which is absent from
    # some minimal base images. Declare its provider per format: procps on Debian,
    # util-linux on RPM distros (there procps-ng ships without the kill applet, and
    # /usr/bin/kill comes from util-linux).
    overrides:
      deb:
        dependencies:
          - procps
      rpm:
        dependencies:
          - util-linux
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh

dockers_v2:
  - id: pingularity
    ids:
      - pingularity
    dockerfile: Dockerfile
    # Named so the docker build context carries them; both Dockerfiles COPY them
    # to /usr/share/doc/pingularity so an image carries the same notices the
    # archives and the deb/rpm do.
    extra_files:
      - LICENSE
      - THIRD-PARTY-NOTICES.md
    images:
      - ghcr.io/pingular/pingularity
    # buildx builds every platform in one pass and assembles a multi-arch manifest
    # per tag automatically, so the per-arch -amd64/-arm64 image tags and the
    # separate docker_manifests block the old `dockers:` setup needed are gone.
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      # `latest` is NOT pushed here. GoReleaser runs before the attestation
      # steps, so tagging latest at build time publishes the channel most users
      # pull from BEFORE its provenance exists - and a run that dies at an
      # attestation leaves latest pointing at an unattested image with no
      # obvious symptom. The release workflow promotes latest by digest AFTER
      # every attestation succeeds (see "Promote the floating tags"). A
      # prerelease never moves it at all.
    # Version/revision attribution is stamped here, at build time, because only
    # the release knows them; the static OCI labels (title/description/source/
    # licenses) live in the Dockerfile itself. Labels go into the image config,
    # annotations onto the OCI manifest/index - registries read the latter, so
    # both carry the pair.
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

  # iperf3-enabled variant. Same multi-arch binaries staged into a debian-slim
  # final stage that bundles iperf3 (Dockerfile.iperf); the default distroless
  # image above has no package manager, so its opt-in iperf3 engine can never run
  # there. Pushed to the SAME repo with an `-iperf` suffix on every tag, mirroring
  # the default image's scheme, so the default tags stay untouched.
  - id: pingularity-iperf
    ids:
      - pingularity
    dockerfile: Dockerfile.iperf
    # Named so the docker build context carries them; both Dockerfiles COPY them
    # to /usr/share/doc/pingularity so an image carries the same notices the
    # archives and the deb/rpm do.
    extra_files:
      - LICENSE
      - THIRD-PARTY-NOTICES.md
    images:
      - ghcr.io/pingular/pingularity
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}-iperf"
      # latest-iperf is promoted after attestation, like latest above.
    # Same version/revision stamping as the default image above.
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

homebrew_casks:
  # Same rc guard as winget below: a prerelease tag must not land in the tap, or
  # every `brew upgrade` user gets the release candidate. Casks are macOS-only (the
  # old formula's caveats were already launchd-specific); Linux users install via
  # the deb/rpm packages or the container image.
  - skip_upload: "auto"
    repository:
      owner: pingular
      name: homebrew-tap
      # Cross-repo push needs the PAT; the default GITHUB_TOKEN is main-repo-only.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/pingular/pingularity
    description: Single-binary internet-connectivity monitor.
    license: MIT
    # Go 1.27 binaries require macOS 13 Ventura or newer. Without this guard a
    # Monterey user gets a clean install and a binary that will not run; with it,
    # brew refuses up front with a version message. goreleaser has no first-class
    # field for a cask's depends_on, so the raw cask DSL rides custom_block.
    custom_block: |
      depends_on macos: :ventura
    # The binary is unsigned/un-notarized, so Homebrew's cask download carries the
    # com.apple.quarantine xattr and Gatekeeper blocks the first run. The old
    # formula never hit this (formulae are not quarantined); strip the xattr on
    # install so `brew install` stays a single step.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pingularity"]
          end
    caveats: |
      To run pingularity as a background service via launchd, run:
        sudo pingularity install

winget:
  # Needs the target repo + a token with push rights at release time.
  - name: pingularity
    publisher: pingular
    package_identifier: pingular.pingularity
    license: MIT
    license_url: https://github.com/pingular/pingularity/blob/main/LICENSE
    homepage: https://github.com/pingular/pingularity
    short_description: Single-binary internet-connectivity monitor.
    # Guard: skip pushing the manifest branch to the winget-pkgs fork on
    # prerelease tags (v*-rc1, -beta) - the maintainer opens the upstream PR by
    # hand from that branch, see RELEASING.md. An RC tag can exercise the
    # tap/GHCR/release path for real without staging a winget manifest.
    skip_upload: "auto"
    repository:
      owner: pingular
      name: winget-pkgs
      branch: pingularity-{{ .Version }}
      # Cross-repo push needs the PAT; the default GITHUB_TOKEN is main-repo-only.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: cansofgrease
      email: github@cansofgrease.com

release:
  # RC/prerelease tags (v*-rc1, -beta) are published as GitHub pre-releases.
  prerelease: auto
  # Draft-until-complete. GoReleaser publishes this release, the GHCR images,
  # the brew cask, and the winget branch BEFORE release.yml's attestation steps
  # run, so with an auto-published release any late failure (attestation, OIDC
  # hiccup, registry flake) stranded a PUBLIC release that the stable-
  # immutability guard then refused to complete (release run 31756904642:
  # assets public, image attestation failed). With draft: true GoReleaser
  # leaves the release unpublished - its own undraft step (which is also what
  # applies make_latest) is a no-op - and release.yml flips it public as its
  # FINAL step, only after every attestation has succeeded. Any earlier
  # failure leaves an invisible draft, which the guard treats as resumable:
  # GitHub's "get a release by tag name" returns published releases only, so
  # a stranded draft reads as 404 there. `latest` is therefore applied
  # exclusively by the flip step in release.yml.
  draft: true
  # A resumed run must never mix assets from two different builds (the
  # binaries are not bit-identical across runs, and checksums.txt is attested
  # as a set), so a stranded draft is deleted and re-created wholesale rather
  # than topped up or reused.
  replace_existing_draft: true
  # Re-cut policy. The rc tag is re-pushed on the same name after every
  # rolling-commit amend, so the GitHub pre-release already exists PUBLISHED
  # with same-named assets (draft: true shapes only release CREATION; updating
  # an existing release keeps its published state) and the re-run would 422 on
  # upload without this overwrite. A STABLE release, by contrast, is cut once
  # and must stay immutable once published: its checksums are attested in
  # release.yml, and silently overwriting a published stable asset would
  # invalidate that provenance. This field is a plain bool (not templateable),
  # so the prerelease-vs-stable split is enforced upstream in release.yml -
  # the "Forbid re-cutting a published stable release" guard fails the run if
  # a stable tag's release is already PUBLISHED - and this overwrite is only
  # ever exercised by the rc re-cut loop.
  replace_existing_artifacts: true
  github:
    owner: pingular
    name: pingularity
